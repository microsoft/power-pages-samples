name: Template validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate templates catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run template validator tests
        run: node --test templates/scripts/validate-templates.test.js

      - name: Validate templates manifest
        run: node templates/scripts/validate-templates.js --enforce-unmanaged
