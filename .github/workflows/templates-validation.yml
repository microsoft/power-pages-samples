name: Template validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate templates catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run template tests
        run: node --test templates/scripts/validate-templates.test.js templates/scripts/supplier-invoice-postbuild.test.js templates/scripts/supplier-account.test.js

      - name: Validate templates manifest
        run: node templates/scripts/validate-templates.js

  supplier-app:
    name: Build and test Supplier app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/spa/supplier-invoice-portal/variants/react/website-code
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: templates/spa/supplier-invoice-portal/variants/react/website-code/package-lock.json
      - name: Restore dependencies
        run: npm ci --registry=https://packagefeedproxy.microsoft.io/npm/ --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Account supplier services
        run: npm test
      - name: Typecheck and build
        run: npm run build
