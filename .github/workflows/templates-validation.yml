name: Template validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/templates-validation.yml"
      - "templates/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate templates catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run template validator tests
        run: node --test templates/scripts/validate-templates.test.js

      - name: Validate templates manifest
        run: node templates/scripts/validate-templates.js
