name: GitHub Pages

# Publishes one GitHub Pages site that contains:
#   - the template and sample catalog from site/, at the site root
#   - the GitHub Repo Stats report, copied read-only from the github-repo-stats
#     branch into microsoft/, so its existing URLs keep working
# The github-repo-stats branch is only read here, never written.

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "templates/**"
      - "samples/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "templates/**"
      - "samples/**"
  # Republish after the daily stats run so the report stays current.
  workflow_run:
    workflows: [ "GitHub Repo Stats" ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment can run at a time. Let a running deployment finish
# instead of cancelling it halfway.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Build catalog
        run: node site/build.mjs --out _site

      - name: Checkout repo stats
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: github-repo-stats
          path: repo-stats
          sparse-checkout: microsoft
          persist-credentials: false

      - name: Add repo stats to site
        if: github.event_name != 'pull_request'
        run: cp -R repo-stats/microsoft _site/microsoft

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
